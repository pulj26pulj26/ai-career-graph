    - data:
        code: "import json, re\n\nREQUIRED = [\"part_number\",\"manufacturer\",\"\
          amplifier_class\",\"channels\",\"output_power\",\n            \"supply_voltage_v\"\
          ,\"thd_n_percent\",\"operating_temperature_c\",\"control_interface\",\n\
          \            \"audio_input\",\"package\",\"aec_q100_grade\",\"diagnostics\"\
          ,\"key_features\",\n            \"applications\",\"extraction_notes\"]\n\
          NUMERIC_TOP = [\"channels\",\"thd_n_percent\",\"aec_q100_grade\"]\n\ndef\
          \ main(llm_output: str, part_number: str) -> dict:\n    raw = (llm_output\
          \ or \"\").strip()\n\n    # 弯引号归一化\n    raw = raw.replace(\"\\u201c\", '\"\
          ').replace(\"\\u201d\", '\"')\n    raw = raw.replace(\"\\u2018\", \"'\"\
          ).replace(\"\\u2019\", \"'\")\n\n    def fail(reason):\n        record =\
          \ {\"status\": \"extraction_failed\", \"reason\": reason,\n            \
          \      \"part_number\": part_number, \"needs_human_review\": True,\n   \
          \               \"extraction\": None, \"llm_raw_excerpt\": raw[:300]}\n\
          \        return {\"record\": json.dumps(record, ensure_ascii=False),\n \
          \               \"status\": \"extraction_failed\", \"reason\": reason,\n\
          \                \"part_number\": part_number}\n\n    # 提取 JSON\n    m =\
          \ re.search(r'\\{.*\\}', raw, re.DOTALL)\n    if not m:\n        return\
          \ fail(\"no_json_object\")\n    candidate = m.group(0)\n\n    try:\n   \
          \     data = json.loads(candidate)\n    except json.JSONDecodeError:\n \
