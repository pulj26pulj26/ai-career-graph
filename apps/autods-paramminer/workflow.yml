    - data:
        code: "import re\n\nMAX_CHARS = 36000\n\ndef main(text: str) -> dict:\n  \
          \  raw = (text or \"\")\n    total_chars = len(raw)\n    dotted = re.compile(r'(?:\\\
          .\\s*){3,}')\n    cleaned = \"\\n\".join(ln for ln in raw.splitlines() if\
          \ not dotted.search(ln))\n\n    def find_heading(title):\n        # 第一遍：严格模式——标题在行首（可带编号，如\
          \ \"2 Pin description\"）\n        pat = r'(?im)^\\s*(?:\\d+(?:\\.\\d+)?\\\
          s+)?' + re.escape(title) + r'\\b[^\\n]*$'\n        m = re.search(pat, cleaned)\n\
          \        if m:\n            return m.start()\n        # 第二遍（兜底）：双栏 PDF 合并行——标题出现在行尾\n\
          \        # （如 \"■ Output short circuit ... the        Description\"）\n \
          \       pat2 = r'(?im)^[^\\n]*?(?:^|\\s)(\\d+(?:\\.\\d+)?\\s+)?' + re.escape(title)\
          \ + r'\\s*$'\n        m2 = re.search(pat2, cleaned)\n        return m2.start()\
          \ if m2 else -1\n\n    def slice_between(start_title, end_titles):\n   \
          \     s = find_heading(start_title)\n        if s < 0:\n            return\
          \ None\n        if isinstance(end_titles, str):\n            end_titles\
          \ = [end_titles]\n        e = len(cleaned)\n        for t in end_titles:\n\
          \            p = find_heading(t)\n            if p > s:\n              \
          \  e = min(e, p)\n        return cleaned[s:e].strip()\n\n    d = find_heading(\"\
          Description\")\n    seg_features = cleaned[:d].strip() if d > 0 else slice_between(\"\
          Features\", [\"Description\", \"Pin description\"])\n    seg_desc = slice_between(\"\
          Description\", [\"Pin description\", \"Electrical specifications\"])\n \
          \   seg_pins = slice_between(\"Pin description\", [\"Electrical specifications\"\
          , \"Electrical characteristics\"])\n    # 电气规格段：结束标题兜底，曲线图区（无抽取价值的大段噪声）不收\n\
          \    seg_elec = slice_between(\"Electrical specifications\",\n         \
          \                    [\"Input configuration\", \"Electrical characteristic\
          \ curves\",\n                              \"Application hints\", \"Package\
          \ information\"])\n    if seg_elec is None:\n        seg_elec = slice_between(\"\
          Electrical characteristics\",\n                                 [\"Electrical\
          \ characteristic curves\", \"Application hints\", \"Package information\"\
          ])\n    seg_input = slice_between(\"Input configuration\", \"Mixing\")\n\
          \    o = find_heading(\"Order codes\")\n    if o < 0:\n        m = re.search(r'(?i)order\\\
          s*codes', cleaned)\n        o = m.start() if m else -1\n    seg_order =\
          \ cleaned[o:].strip() if o >= 0 else None\n\n    labels = [(\"=== ELECTRICAL\
          \ SPECIFICATIONS ===\", seg_elec),  # 优先拼入，保证关键表格不被截\n              (\"\
          === FEATURES ===\", seg_features),\n              (\"=== DESCRIPTION ===\"\
          , seg_desc),\n              (\"=== PIN DESCRIPTION ===\", seg_pins),\n \
          \             (\"=== INPUT CONFIGURATION ===\", seg_input),\n          \
          \    (\"=== ORDER CODES ===\", seg_order)]\n    found = [seg for _, seg\
          \ in labels if seg]\n\n    if len(found) <= 1:\n        body = cleaned[:MAX_CHARS]\n\
          \        coverage_pct = 100.0 if total_chars > 0 else 0.0\n    else:\n \
          \       body = \"\\n\\n\".join(name + \"\\n\" + seg for name, seg in labels\
          \ if seg)\n        if len(body) > MAX_CHARS:\n            body = body[:MAX_CHARS]\n\
          \        coverage_pct = round(len(body) / total_chars * 100, 1) if total_chars\
          \ else 0.0\n\n    return {\"selected_text\": body, \"total_chars\": total_chars,\
          \ \"coverage_pct\": coverage_pct}\n"
        code_language: python3
        outputs:
          coverage_pct:
            children: null
            type: number
          selected_text:
            children: null
            type: string
          total_chars:
            children: null
            type: number
