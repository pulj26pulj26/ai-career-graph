app:
  description: '基于 ai-career-graph 六节点技能图谱（A1-A3 架构师线 / S1-S3 数据科学家线）的 AI 职业成长教练。解答节点能力要求、前置依赖、迁移路径问题，协助设计以
    GitHub 仓库为证据的冲刺任务。

    '
  icon: 🤖
  icon_background: '#FEF7C3'
  mode: chat
  name: AI职业图谱教练
  use_icon_as_answer_icon: false
dependencies: []
kind: app
model_config:
  agent_mode:
    enabled: false
    prompt: null
    strategy: null
    tools: []
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    retrieval_model: multiple
  dataset_query_variable: null
  external_data_tools: []
  file_upload:
    image:
      detail: high
      enabled: false
      number_limits: 3
      transfer_methods:
      - remote_url
      - local_file
  model:
    completion_params: {}
    mode: chat
    name: null
    provider: null
  more_like_this:
    enabled: false
  opening_statement: null
  pre_prompt: null
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    configs: []
    enabled: false
    type: ''
  speech_to_text:
    enabled: false
  suggested_questions: []
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
  user_input_form: []
